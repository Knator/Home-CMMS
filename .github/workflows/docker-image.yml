# Build and publish the container image when a release is published.
#
# Images go to GHCR (ghcr.io) rather than Docker Hub because it needs no
# secrets: GITHUB_TOKEN is issued to the workflow automatically, so there is
# nothing to rotate and nothing to leak. The package lands under the same
# account as the repository.

name: Publish Docker image

on:
  release:
    types: [published]
  # So a build can be re-run without cutting another release — useful when a
  # publish fails for a reason that has nothing to do with the code.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      # Emulation for the arm64 build. A homelab instance is as likely to be a
      # Raspberry Pi as an x86 box, and every dependency here ships an aarch64
      # wheel, so nothing is compiled under emulation and the cost is small.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercased for us: GHCR rejects capitals, and repository names have
          # them. Knator/Home-CMMS -> ghcr.io/knator/home-cmms
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # `latest` follows full releases only. A pre-release moving it would
            # hand unfinished work to everyone who never pins a version.
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
          labels: |
            org.opencontainers.image.title=Home CMMS
            org.opencontainers.image.description=Self-hosted maintenance management for your house

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache between runs, so a release that only changes app code
          # does not reinstall every dependency.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what was published
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
