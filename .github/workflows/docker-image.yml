# Build and publish the container image when a release is published to GHCR.


name: Publish Docker image

on:
  release:
    types: [published]
  # So a build can be re-run without cutting another release — useful when a
  # publish fails for a reason that has nothing to do with the code.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Refuses a release whose app/version.py was never bumped. That constant is
  # what the Maintenance page reports and what the update check compares, so a
  # forgotten bump ships an image that misreports its own version — and, being
  # only a number on a page, would go unnoticed for a long time.
  #
  # It gates the build rather than merely reporting, because the release itself
  # cannot be prevented: GitHub has no before-publish hook, so by the time any
  # workflow runs the tag and the release already exist. Stopping the *image* is
  # the last point where the mistake costs nothing — delete the release, fix the
  # constant, tag again.
  #
  # Releases only. A workflow_dispatch rebuild has no release tag to compare.
  verify:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: The version constant must match the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys

          tag = os.environ['TAG'].strip()
          want = tag[1:] if tag[:1] in 'vV' else tag

          found = re.findall(r"__version__ = '([^']*)'",
                             pathlib.Path('app/version.py').read_text())
          if len(found) != 1:
              sys.exit(f'::error::expected one __version__ line in app/version.py, '
                       f'found {len(found)} — cannot tell which to check')
          if found[0] != want:
              sys.exit(
                  f'::error::Release {tag} was published, but app/version.py says '
                  f"{found[0]}. No image has been built. Set __version__ = '{want}', "
                  f'delete the release and its tag, and publish it again.'
              )
          print(f'app/version.py says {found[0]}, matching {tag}')
          PY

  publish:
    runs-on: ubuntu-latest
    # `always()` keeps the manual-rebuild path working: `verify` is skipped
    # there, and a skipped dependency would otherwise skip this too.
    needs: verify
    if: always() && needs.verify.result != 'failure'

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      # Emulation for the arm64 build. A homelab instance is as likely to be a
      # Raspberry Pi as an x86 box, and every dependency here ships an aarch64
      # wheel, so nothing is compiled under emulation and the cost is small.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercased for us: GHCR rejects capitals, and repository names have
          # them. Knator/Home-CMMS -> ghcr.io/knator/home-cmms
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # `latest` follows full releases only. A pre-release moving it would
            # hand unfinished work to everyone who never pins a version.
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
          labels: |
            org.opencontainers.image.title=Home CMMS
            org.opencontainers.image.description=Self-hosted maintenance management for your house

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache between runs, so a release that only changes app code
          # does not reinstall every dependency.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what was published
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
