<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Home CMMS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>
<div class="login-wrap">
  <div class="login-toggle">
    <button type="button" class="theme-toggle" onclick="toggleTheme()"
            aria-pressed="false" aria-label="Switch between light and dark mode"
            title="Switch to dark mode">
      <span class="icon-light" aria-hidden="true">&#9788;</span>
      <span class="icon-dark" aria-hidden="true">&#9790;</span>
    </button>
  </div>
  <div class="login-card">
    <div class="login-title">Home CMMS</div>
    <div class="login-subtitle">Sign in to your account</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}" style="margin-bottom:14px;">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group" style="margin-bottom:14px;">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="form-group" style="margin-bottom:20px;">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <label style="display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font-weight:400;font-size:13px;">
          <input type="checkbox" name="remember"> Remember me
        </label>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Sign in</button>
    </form>
  </div>
</div>
</body>
</html>
