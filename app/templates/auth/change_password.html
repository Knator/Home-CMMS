{% extends 'base.html' %}
{% block title %}Change Password — Home CMMS{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}
{% from '_password.html' import requirements_hint, requirements_list %}
<div class="form-shell" style="--shell-max: 480px;">
  <div class="card">
    <div class="card-body">
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group" style="margin-bottom:14px;">
          <label>Current Password</label>
          <input type="password" name="current_password" required>
        </div>
        <div class="form-group" style="margin-bottom:14px;">
          <label>New Password {{ requirements_hint() }}</label>
          <input type="password" name="new_password"
                 minlength="{{ password_min_length() }}" required>
          {{ requirements_list() }}
        </div>
        <div class="form-group" style="margin-bottom:20px;">
          <label>Confirm New Password</label>
          <input type="password" name="confirm_password" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Update Password</button>
          <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
