{% extends 'base.html' %}
{% set is_edit = user is not none %}
{% block title %}{{ 'Edit' if is_edit else 'New' }} User — Home CMMS{% endblock %}
{% block page_title %}{{ 'Edit' if is_edit else 'New' }} User{% endblock %}

{% block content %}
<div class="form-shell" style="--shell-max: 480px;">
  <div class="card">
    <div class="card-body">
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-grid">
          {% if not is_edit %}
          <div class="form-group full">
            <label>Username *</label>
            <input type="text" name="username" required autocomplete="off">
          </div>
          {% endif %}
          <div class="form-group full">
            <label>Email *</label>
            <input type="email" name="email" value="{{ user.email if is_edit else '' }}" required>
          </div>
          <div class="form-group">
            <label>Role</label>
            <select name="role">
              <option value="user" {{ 'selected' if is_edit and user.role == 'user' }}>User</option>
              <option value="admin" {{ 'selected' if is_edit and user.role == 'admin' }}>Admin</option>
            </select>
          </div>
          <div class="form-group full">
            <label>{{ 'New Password' if is_edit else 'Password *' }}</label>
            <input type="password" name="{{ 'new_password' if is_edit else 'password' }}"
                   {{ '' if is_edit else 'required' }} minlength="8"
                   placeholder="{{ 'Leave blank to keep current' if is_edit else '' }}">
          </div>
        </div>
        <div class="form-actions mt-1">
          <button type="submit" class="btn btn-primary">{{ 'Save Changes' if is_edit else 'Create User' }}</button>
          <a href="{{ url_for('admin.users') }}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
