# Build and publish the container image when a release is published to GHCR.


name: Publish Docker image

on:
  release:
    types: [published]
  # So a build can be re-run without cutting another release — useful when a
  # publish fails for a reason that has nothing to do with the code.
  workflow_dispatch:
  # Called by release.yml. It has to call this directly rather than rely on the
  # `release: published` trigger above: a release created with GITHUB_TOKEN
  # deliberately does not start another workflow, which GitHub does to stop
  # workflows triggering themselves forever. Without this the image would
  # silently never be built for an automated release.
  workflow_call:
    inputs:
      ref:
        description: 'Tag to build'
        required: true
        type: string
      prerelease:
        description: 'Whether this is a pre-release, so `latest` stays put'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      # Whether this build should move the `latest` tag.
      #
      # `github.event_name` cannot answer that on its own, because in a called
      # workflow the whole `github` context belongs to the **caller** — so when
      # release.yml (a workflow_dispatch) calls this, `github.event_name` reads
      # 'workflow_dispatch' no matter what kind of release it is. Trusting it
      # would move `latest` onto every pre-release, silently: the release is
      # correctly marked, the image builds, and only the pointer is wrong.
      #
      # So: when called, believe the caller's `prerelease` input. Otherwise fall
      # back to the event — a manual rebuild moves `latest`, a published release
      # moves it unless GitHub says it is a pre-release. `inputs.ref` is what
      # distinguishes the two, being set only on the workflow_call path.
      MOVE_LATEST: >-
        ${{ inputs.ref && inputs.prerelease == false
            || !inputs.ref && (github.event_name == 'workflow_dispatch'
                               || github.event.release.prerelease == false) }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Emulation for the arm64 build. A homelab instance is as likely to be a
      # Raspberry Pi as an x86 box, and every dependency here ships an aarch64
      # wheel, so nothing is compiled under emulation and the cost is small.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercased for us: GHCR rejects capitals, and repository names have
          # them. Knator/Home-CMMS -> ghcr.io/knator/home-cmms
          images: ghcr.io/${{ github.repository }}
          # `value=` pins the version when release.yml calls this with a ref,
          # where the git context alone would not carry it. The `|| github.ref`
          # is not decoration: `inputs.ref` is empty on the `release` and
          # `workflow_dispatch` triggers, and an empty value would leave the
          # version tags to whatever metadata-action does with a blank — so a
          # release published from the GitHub UI could build an image tagged
          # only `latest`, with nothing reporting a problem.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.ref || github.ref }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.ref || github.ref }}
            type=semver,pattern={{major}},value=${{ inputs.ref || github.ref }}
            # `latest` follows full releases only. A pre-release moving it would
            # hand unfinished work to everyone who never pins a version. See
            # MOVE_LATEST above for why this is not read from the event here.
            type=raw,value=latest,enable=${{ env.MOVE_LATEST }}
          labels: |
            org.opencontainers.image.title=Home CMMS
            org.opencontainers.image.description=Self-hosted maintenance management for your house

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache between runs, so a release that only changes app code
          # does not reinstall every dependency.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what was published
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
